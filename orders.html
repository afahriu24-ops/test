<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Greenline Market - Orders</title>
    <link rel="stylesheet" href="style/admin.css">
    <link rel="stylesheet" href="style/greenline.css">
</head>
<body class="admin-page">

    <div class="sidebar">
        <div class="sidebar-brand">
            <h5><span class="brand-mark" aria-hidden="true">G</span><span>Greenline Market</span></h5>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-section-title">MAIN</li>
            <li>
                <a href="admin.html">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="orders.html" class="active">
                    <span class="icon">🛍️</span>
                    <span>Orders</span>
                </a>
            </li>
            <li>
                <a href="products.html">
                    <span class="icon">📦</span>
                    <span>Products</span>
                </a>
            </li>
            <li>
                <a href="customers.html">
                    <span class="icon">👥</span>
                    <span>Customers</span>
                </a>
            </li>

            <li class="sidebar-section-title">STORE</li>
            <li>
                <a href="revenue.html">
                    <span class="icon">💲</span>
                    <span>Revenue</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="main-content">

        <div class="topbar">
            <h3>Orders Management</h3>
            <a href="account.html" class="account-link" title="Account">
                <span>👤</span>
                <span>Admin</span>
            </a>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-card-icon">🛍️</div>
                <h6>Total Orders</h6>
                <h3 id="totalOrdersCount">0</h3>
                <p class="stat-card-change">All orders</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5>All Orders</h5>
            </div>
            <div class="table-wrapper">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>ORDER ID</th>
                            <th>CUSTOMER</th>
                            <th>PRODUCT</th>
                            <th>DATE</th>
                            <th>AMOUNT</th>
                            <th>STATUS</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="scripts/users/user.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/users/orders.js"></script>
</body>
</html>
